<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
  }

  #introVideo {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
</style>
<video id="introVideo" autoplay muted playsinline
       style="display:block; width:100%; height:100%; object-fit:cover;">
</video>

<script>
  const clips = [
    "PS_Video_8_Fast_Logo_Fade_1080p.mp4",
    "PS_Video_7_Fast_Logo_Fade_1080p.mp4",
    "PS_Video_6_Fast_Logo_Fade_1080p.mp4",
    "PS_Video_5_Fast_Logo_Fade_1080p.mp4",
    "PS_Video_4_Fast_Logo_Fade_1080p.mp4",
    "PS_Video_3_Fast_Logo_Fade_1080p.mp4",
    "PS_Video_2_Fast_Logo_Fade_1080p.mp4",
  ];

  // Avoid the clip shown on the previous page load.
  let previous = null;
  try {
    previous = sessionStorage.getItem("lastIntroClip");
  } catch {}

  const choices = clips.length > 1
    ? clips.filter(clip => clip !== previous)
    : clips;

  const selected =
    choices[Math.floor(Math.random() * choices.length)];

  try {
    sessionStorage.setItem("lastIntroClip", selected);
  } catch {}

  const video = document.getElementById("introVideo");
  video.src = selected;
  video.play().catch(() => {});
</script>
